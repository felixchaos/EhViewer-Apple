name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: xcode-27
    
    steps:
    - uses: actions/checkout@v4

    # Keep the iOS check on a toolchain that supports the full iPhone Duo display.
    - name: Verify iOS SDK
      run: |
        xcodebuild -version
        sdk=$(xcrun --sdk iphoneos --show-sdk-version)
        echo "iOS SDK: $sdk"
        if ! awk -F. '$1 > 27 || ($1 == 27 && $2 >= 1) { ok = 1 } END { exit !ok }' <<< "$sdk"; then
          echo "::error::iOS SDK 27.1 or newer is required for full iPhone Duo display support."
          exit 1
        fi

    - name: Build for iOS
      run: |
        xcodebuild build \
          -project "ehviewer apple.xcodeproj" \
          -scheme "ehviewer apple" \
          -destination "generic/platform=iOS" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Build for macOS
      run: |
        xcodebuild build \
          -project "ehviewer apple.xcodeproj" \
          -scheme "ehviewer apple" \
          -destination "platform=macOS" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
