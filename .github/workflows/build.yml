name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4

    # 项目最低要求 iOS 26 SDK，钉死旧 Xcode 会导致
    # "iOS 18.0 is not installed"。这里选镜像上最新的一个。
    - name: Select newest Xcode
      run: |
        LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
        LATEST=${LATEST:-/Applications/Xcode.app}
        sudo xcode-select -s "$LATEST"
        xcodebuild -version
        echo "可用 SDK:"; xcodebuild -showsdks | grep -i ios || true

    - name: Build for iOS
      run: |
        xcodebuild build \
          -project "ehviewer apple.xcodeproj" \
          -scheme "ehviewer apple" \
          -destination "generic/platform=iOS" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Build for macOS
      run: |
        xcodebuild build \
          -project "ehviewer apple.xcodeproj" \
          -scheme "ehviewer apple" \
          -destination "platform=macOS" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
