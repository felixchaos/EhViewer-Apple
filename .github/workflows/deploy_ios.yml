# ────────────────────────────────────────────────────────────
#  EhViewer Apple — Ad-Hoc 构建 & 部署流水线
#  触发: main 分支 push / 手动 dispatch
#  目标: RackNerd (Stellatrix.icu) → itms-services 安装
# ────────────────────────────────────────────────────────────

name: Build & Deploy iOS (Ad-Hoc)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_note:
        description: "本次构建备注 (会追加到版本标题)"
        required: false
        default: ""

# 同一分支只保留最新一次构建
concurrency:
  group: deploy-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: "ehviewer apple"
  PROJECT: "ehviewer apple.xcodeproj"
  BUNDLE_ID: "Stellatrix.ehviewer-apple"
  TEAM_ID: "HWZEUNLCY6"
  ARCHIVE_PATH: build/EhViewer.xcarchive
  IPA_DIR: build/ipa
  EXPORT_OPTIONS: build/ExportOptions.plist

jobs:
  build-and-deploy:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      # ─── 0. 检出代码 ───────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─── 1. 环境准备: Xcode 版本 ──────────────────────────
      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          LATEST=${LATEST:-/Applications/Xcode.app}
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      # ─── 1.5 前置检查: 签名凭据是否配置 ──────────────────
      # 缺 secret 时 security import 只会抛
      # "SecKeychainItemImport: One or more parameters ... not valid"，
      # 看不出根因。这里提前失败并说清楚缺什么。
      - name: Verify signing secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$BUILD_CERTIFICATE_BASE64" ] && MISSING="$MISSING BUILD_CERTIFICATE_BASE64"
          [ -z "$P12_PASSWORD" ] && MISSING="$MISSING P12_PASSWORD"
          [ -z "$BUILD_PROVISION_PROFILE_BASE64" ] && MISSING="$MISSING BUILD_PROVISION_PROFILE_BASE64"
          [ -z "$KEYCHAIN_PASSWORD" ] && MISSING="$MISSING KEYCHAIN_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::缺少签名 Secret:$MISSING"
            echo "在 Settings → Secrets and variables → Actions 中配置后重新运行。"
            echo "  BUILD_CERTIFICATE_BASE64       — 导出的 .p12 证书，base64"
            echo "  P12_PASSWORD                   — 导出 .p12 时设置的密码"
            echo "  BUILD_PROVISION_PROFILE_BASE64 — Ad-Hoc .mobileprovision，base64"
            echo "  KEYCHAIN_PASSWORD              — 任意字符串，仅用于 CI 临时钥匙串"
            exit 1
          fi
          echo "✅ 签名凭据齐全"

      # ─── 2. 证书 & 描述文件注入 ────────────────────────────
      - name: Import certificate & provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # 解码证书和描述文件
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          # 创建临时钥匙串
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 导入证书
          # 不能加 -t cert: 那会只挑出证书、丢掉私钥。签名需要两者配对，这里全量导入。
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          # 校验配对是否成立。只导出了证书 (缺私钥) 或只导出了私钥 (缺证书) 都会在这里被挡下，
          # 否则错误会拖到 Archive 阶段才以 "No signing certificate" 的形式冒出来，很难定位。
          IDENTITIES=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true)
          echo "$IDENTITIES"
          if ! echo "$IDENTITIES" | grep -qE '^[[:space:]]+[0-9]+\)'; then
            echo "::error::BUILD_CERTIFICATE_BASE64 未能导入出可用于签名的身份。"
            echo "::error::请在「钥匙串访问」中选中**证书那一行**（不是展开后的私钥）右键导出 .p12，"
            echo "::error::导出的文件必须同时包含证书与私钥。"
            exit 1
          fi

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          # 安装描述文件
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< \
            "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PP_UUID.mobileprovision"

          echo "PP_UUID=$PP_UUID" >> "$GITHUB_ENV"
          echo "✅ Certificate imported, provisioning profile installed: $PP_UUID"

      # ─── 3. 解析 SPM 依赖 ──────────────────────────────────
      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm_cache"

      # ─── 4. 生成 ExportOptions.plist ────────────────────────
      - name: Generate ExportOptions.plist
        run: |
          mkdir -p build
          cat > "$EXPORT_OPTIONS" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>release-testing</string>
            <key>teamID</key>
            <string>HWZEUNLCY6</string>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>Stellatrix.ehviewer-apple</key>
              <string>${PP_UUID}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          # 替换 PP_UUID 占位符
          sed -i '' "s/\${PP_UUID}/$PP_UUID/" "$EXPORT_OPTIONS"
          echo "✅ ExportOptions.plist generated"
          cat "$EXPORT_OPTIONS"

      # ─── 5. Archive ─────────────────────────────────────────
      - name: Archive
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm_cache" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PP_UUID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            COMPILER_INDEX_STORE_ENABLE=NO

          echo "✅ Archive complete"
          ls -la "$ARCHIVE_PATH"

      # ─── 6. Export IPA ──────────────────────────────────────
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$IPA_DIR"

          # 重命名为固定文件名
          IPA_FILE=$(find "$IPA_DIR" -name "*.ipa" | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "❌ No IPA file found!"
            exit 1
          fi
          mv "$IPA_FILE" "$IPA_DIR/EhViewer.ipa"

          echo "✅ IPA exported"
          ls -lh "$IPA_DIR/EhViewer.ipa"

      # ─── 7. 生成版本信息 ────────────────────────────────────
      - name: Extract version info
        id: version
        run: |
          PLIST_PATH="$ARCHIVE_PATH/Products/Applications/ehviewer apple.app/Info.plist"
          if [ ! -f "$PLIST_PATH" ]; then
            # fallback: 从项目读取
            VERSION="1.0.0"
            BUILD_NUM="1"
          else
            VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST_PATH")
            BUILD_NUM=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST_PATH")
          fi
          DATE=$(date +%Y%m%d)
          TITLE="EhViewer v${VERSION} (${BUILD_NUM}) - ${DATE}"
          if [ -n "${{ github.event.inputs.build_note }}" ]; then
            TITLE="${TITLE} - ${{ github.event.inputs.build_note }}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "📦 $TITLE"

      # ─── 8. 生成 manifest.plist ─────────────────────────────
      - name: Generate manifest.plist
        run: |
          cat > "$IPA_DIR/manifest.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>https://ios.stellatrix.icu/EhViewer.ipa</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key>
                  <string>${{ env.BUNDLE_ID }}</string>
                  <key>bundle-version</key>
                  <string>${{ steps.version.outputs.version }}</string>
                  <key>kind</key>
                  <string>software</string>
                  <key>title</key>
                  <string>${{ steps.version.outputs.title }}</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          EOF

          echo "✅ manifest.plist generated"
          cat "$IPA_DIR/manifest.plist"

      # ─── 9. 留存产物 ────────────────────────────────────────
      # 先于部署执行：服务器凭据是可选的，但包必须无条件拿得到，
      # 否则一次成功的构建会因为部署失败而白跑。
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EhViewer-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: |
            build/ipa/EhViewer.ipa
            build/ipa/manifest.plist
          retention-days: 30
          if-no-files-found: error

      # ─── 10. 部署到 Stellatrix 服务器 (可选) ────────────────
      # 未配置 DEPLOY_* 凭据时整体跳过，构建仍算成功。
      # secrets 上下文在 step 级 if 里不可用，先探测一次落成 output。
      - name: Check deploy credentials
        id: deploycfg
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$DEPLOY_HOST" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "服务器凭据已配置，将部署到分发服务器"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "未配置 DEPLOY_* 凭据，跳过服务器部署（IPA 已存为 workflow artifact）"
          fi

      - name: Deploy to Stellatrix
        if: steps.deploycfg.outputs.enabled == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "build/ipa/EhViewer.ipa,build/ipa/manifest.plist"
          target: "/var/www/html/ios/"
          strip_components: 2

      # ─── 11. 服务器后处理 (可选) ────────────────────────────
      - name: Post-deploy setup
        if: steps.deploycfg.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd /var/www/html/ios/
            chmod 644 EhViewer.ipa manifest.plist
            echo "$(date): Deployed ${{ steps.version.outputs.title }}" >> deploy.log
            echo "✅ Files deployed and permissions set"
            ls -lh EhViewer.ipa manifest.plist

      # ─── 12. 清理钥匙串 ────────────────────────────────────
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

      # ─── 13. 构建摘要 ──────────────────────────────────────
      - name: Build summary
        if: success()
        run: |
          echo ""
          echo "══════════════════════════════════════════════"
          echo "  ✅ 构建 & 部署成功"
          echo "──────────────────────────────────────────────"
          echo "  版本: ${{ steps.version.outputs.title }}"
          echo "  提交: ${{ github.sha }}"
          echo ""
          echo "  📲 安装链接:"
          echo "  https://ios.stellatrix.icu"
          echo ""
          echo "  📦 直接安装 (Safari 打开):"
          echo "  itms-services://?action=download-manifest&url=https://ios.stellatrix.icu/manifest.plist"
          echo "══════════════════════════════════════════════"

          # GitHub Actions Job Summary
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 📱 EhViewer iOS 部署成功

          | 项目 | 值 |
          |------|-----|
          | **版本** | ${{ steps.version.outputs.version }} (${{ steps.version.outputs.build }}) |
          | **日期** | ${{ steps.version.outputs.date }} |
          | **提交** | \`${{ github.sha }}\` |

          ### 安装方式
          Safari 打开: \`itms-services://?action=download-manifest&url=https://ios.stellatrix.icu/manifest.plist\`

          或访问: [https://ios.stellatrix.icu](https://ios.stellatrix.icu)
          EOF
